server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: riceproduction-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: .*riceproduction-api.*
        action: keep
      - target_label: job
        replacement: riceproduction-api
      - target_label: application
        replacement: rice-production-api
      - target_label: environment
        replacement: production
